<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'espace qui parle — Atelier d'aménagement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --vert:#1b6b46;      /* vert des fiches séquence */
  --vert-fonce:#12492f;
  --sauge:#b9d4c7;
  --sauge-clair:#e3efe8;
  --rose:#ef86ab;      /* étiquettes roses des fiches */
  --rose-clair:#fbe3ec;
  --papier:#fbfcfa;
  --encre:#1d2a24;
  --gris:#5d6b64;
  --ok:#1b6b46;
  --rayon:14px;
  font-family:'Lexend', 'Segoe UI', Arial, sans-serif;
  color:var(--encre);
}
*{box-sizing:border-box}
body{margin:0;background:var(--papier);font-size:17px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--rose);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- En-tête : la façade et son store ---------- */
header.facade{background:var(--vert);color:#fff;padding:18px 24px 0;position:relative}
.facade-haut{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;max-width:1280px;margin:0 auto;padding-bottom:18px}
.facade h1{margin:0;font-size:1.55rem;font-weight:800;letter-spacing:-.01em}
.facade .sous-titre{margin:2px 0 0;font-size:.95rem;opacity:.85}
.equipe{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:.92rem}
.badge{background:rgba(255,255,255,.14);border-radius:999px;padding:5px 12px}
.badge strong{font-weight:700}
.actions-fichier{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--sauge-clair);color:var(--vert-fonce)}
.btn:hover{filter:brightness(.96)}
.btn.clair{background:#fff;color:var(--vert-fonce)}
.btn.rose{background:var(--rose);color:#3b0f20}
.btn.plein{background:var(--vert);color:#fff}
.btn.petit{padding:6px 12px;font-size:.9rem}
.store{height:26px;background:
  repeating-linear-gradient(90deg,var(--vert) 0 36px,#fff 36px 72px);
  -webkit-mask:radial-gradient(18px at 18px 0,#000 98%,transparent) 0 0/36px 100% repeat-x;
          mask:radial-gradient(18px at 18px 0,#000 98%,transparent) 0 0/36px 100% repeat-x;
  position:absolute;left:0;right:0;bottom:-26px}
.statut{font-size:.82rem;opacity:.85;min-height:1.2em}

/* ---------- Onglets ---------- */
nav.onglets{max-width:1280px;margin:44px auto 0;padding:0 24px;display:flex;gap:6px;flex-wrap:wrap}
.onglet{border:2px solid var(--sauge);background:#fff;border-radius:12px 12px 0 0;padding:10px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;min-width:130px;text-align:left}
.onglet .seance{font-size:.75rem;color:var(--gris)}
.onglet .nom{font-weight:700}
.onglet[aria-selected="true"]{background:var(--sauge);border-color:var(--sauge)}
.onglet.verrou{opacity:.55;cursor:not-allowed}
.onglet.verrou .nom::after{content:" 🔒"}

main{max-width:1280px;margin:0 auto;padding:0 24px 60px}
.page{border-top:4px solid var(--sauge);padding-top:24px;display:grid;grid-template-columns:280px 1fr;gap:28px;align-items:start}
@media (max-width:900px){.page{grid-template-columns:1fr}}

/* ---------- Mission du tuteur (colonne gauche) ---------- */
.mission{background:var(--sauge-clair);border-radius:var(--rayon);padding:18px 18px 16px;position:sticky;top:12px}
.etiquette{display:inline-block;background:var(--rose);color:#3b0f20;font-weight:700;border-radius:8px;padding:4px 12px;font-size:.95rem;margin:0 0 10px}
.mission p{margin:0 0 10px}
.mission ol{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.mission li label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;background:#fff;border-radius:10px;padding:9px 10px}
.mission li input{width:22px;height:22px;flex:none;margin:1px 0 0;accent-color:var(--vert)}
.mission li.fait label{background:#d5e8dd;text-decoration:line-through;text-decoration-color:rgba(0,0,0,.35)}
.ecouter{margin-top:12px}

/* ---------- Contenu ---------- */
h2{font-size:1.35rem;margin:0 0 12px;font-weight:800;color:var(--vert-fonce)}
h3{font-size:1.08rem;margin:0 0 8px}
.lettre{background:#fff;border:2px solid var(--sauge);border-radius:var(--rayon);padding:22px 26px;max-width:70ch}
.lettre p{margin:0 0 12px}
.lettre .signature{font-weight:700;color:var(--vert-fonce)}
.champs{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:18px 0;max-width:70ch}
label.champ{display:flex;flex-direction:column;gap:6px;font-weight:600}
input[type=text],textarea{border:2px solid var(--sauge);border-radius:10px;padding:10px 12px;background:#fff;width:100%}
textarea{min-height:64px;resize:vertical}
.roles{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:6px}
.role{background:var(--rose-clair);border-radius:10px;padding:8px 12px}

/* Enseignes */
.enseignes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:24px}
.carte-enseigne{border:3px solid transparent;background:#fff;border-radius:var(--rayon);padding:16px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;box-shadow:0 0 0 2px var(--sauge) inset}
.carte-enseigne .pic{font-size:2rem;line-height:1}
.carte-enseigne .n{font-weight:800;font-size:1.1rem}
.carte-enseigne .s{font-size:.9rem;color:var(--gris)}
.carte-enseigne[aria-pressed="true"]{border-color:var(--vert);background:var(--sauge-clair)}
.brief{background:#fff;border-radius:var(--rayon);border:2px solid var(--sauge);padding:22px 24px}
.brief header{display:flex;gap:14px;align-items:center;margin-bottom:12px}
.brief header .pic{font-size:2.4rem}
.brief .de{color:var(--gris);font-size:.92rem;margin:0}
.brief-grille{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.bloc{background:var(--sauge-clair);border-radius:12px;padding:14px 16px}
.bloc p{margin:0}
.exigences{background:var(--rose-clair);border-radius:12px;padding:14px 16px;margin-top:16px}
.exigences ul{margin:0;padding-left:20px}
.exigences li{margin:4px 0}
.note{font-size:.82rem;color:var(--gris);margin-top:14px}
.vide{background:#fff;border:2px dashed var(--sauge);border-radius:var(--rayon);padding:24px;text-align:center;color:var(--gris)}

/* Moodboard */
.mood{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:22px;align-items:start}
@media (max-width:1150px){.mood{grid-template-columns:1fr}}
.cases{display:grid;gap:14px}
.case{background:#fff;border:2px solid var(--sauge);border-radius:var(--rayon);padding:16px}
.case.complete{border-color:var(--vert)}
.case-tete{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.case-tete h3{margin:0}
.coche{font-size:.85rem;font-weight:700;color:var(--gris)}
.case.complete .coche{color:var(--ok)}
.aide{font-size:.9rem;color:var(--gris);margin:0 0 10px}
.puces{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.puce{border:2px solid var(--sauge);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer}
.puce[aria-pressed="true"]{background:var(--vert);border-color:var(--vert);color:#fff}
.pourquoi{margin-top:8px}
.pourquoi span{font-size:.9rem;font-weight:600}
.palette{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:10px}
.couleur{display:flex;flex-direction:column;align-items:center;gap:4px}
.couleur input[type=color]{width:58px;height:58px;border:2px solid var(--sauge);border-radius:12px;padding:3px;background:#fff;cursor:pointer}
.couleur button{border:0;background:none;color:var(--gris);font-size:.8rem;cursor:pointer;text-decoration:underline}
.produits{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:10px}
.produit{border:2px dashed var(--sauge);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch}
.produit .img{aspect-ratio:1;border-radius:8px;background:var(--sauge-clair) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--gris);font-size:.85rem;text-align:center;cursor:pointer}
.produit input[type=text]{padding:6px 8px;font-size:.9rem}
.produit .retirer{border:0;background:none;color:var(--gris);font-size:.8rem;cursor:pointer;text-decoration:underline}
.mots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.piece{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.mini-piece{width:150px;height:96px;border-radius:10px;position:relative;overflow:hidden;border:2px solid var(--sauge)}
.mini-piece .mur{position:absolute;inset:0 0 38% 0}
.mini-piece .sol{position:absolute;inset:62% 0 0 0}

/* Aperçu du moodboard */
.apercu{position:sticky;top:12px;background:#fff;border-radius:var(--rayon);border:2px solid var(--sauge);padding:14px}
.planche{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--papier);border-radius:10px;padding:8px}
.planche .titre{grid-column:1/-1;font-weight:800;font-size:1.05rem;color:var(--vert-fonce);display:flex;gap:8px;align-items:center}
.planche .bande{grid-column:1/-1;display:flex;height:42px;border-radius:8px;overflow:hidden;background:var(--sauge-clair)}
.planche .bande div{flex:1}
.planche .im{aspect-ratio:1;border-radius:8px;background:var(--sauge-clair) center/cover no-repeat}
.planche .etiq{grid-column:span 2;background:var(--sauge-clair);border-radius:8px;padding:6px 8px;font-size:.8rem}
.planche .etiq b{display:block;font-size:.72rem;color:var(--gris);font-weight:600}
.planche .motsap{grid-column:1/-1;text-align:center;font-weight:700;padding:6px;border-radius:8px;background:var(--rose-clair)}
.progression{margin:12px 0 0;font-size:.9rem}
.barre{height:10px;border-radius:99px;background:var(--sauge-clair);overflow:hidden;margin-top:6px}
.barre div{height:100%;background:var(--vert);width:0;transition:width .3s}

/* Plan du magasin */
.page.large{grid-template-columns:1fr}
.page.large .mission{position:static}
.page.large .mission ol{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.atelier{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
@media (max-width:1150px){.atelier{grid-template-columns:1fr}}
.modes{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.mode{border:2px solid var(--sauge);background:#fff;border-radius:10px;padding:8px 14px;font-weight:600;cursor:pointer}
.mode[aria-pressed="true"]{background:var(--vert);border-color:var(--vert);color:#fff}
.cadre-plan{background:#fff;border:2px solid var(--sauge);border-radius:var(--rayon);padding:10px}
svg.plan{width:100%;height:auto;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
svg.plan:focus-visible{outline:3px solid var(--rose)}
svg.plan .meuble{cursor:grab}
svg.plan .meuble.sel rect.corps{stroke:var(--rose);stroke-width:.12}
svg.plan text{font-family:'Lexend',Arial,sans-serif;pointer-events:none}
.emplacement.cliquable{cursor:pointer}
.emplacement.cliquable:hover rect.corps{fill:rgba(239,134,171,.5)}
.emplacement.choisi rect.corps{stroke:#c2185b;stroke-width:.14}
.emplacement:focus-visible{outline:none}
.emplacement:focus-visible rect.corps{stroke:#1d2a24;stroke-width:.16}
.question{font-size:1.15rem;color:var(--vert-fonce)}
.exemple{background:var(--sauge-clair);border-radius:10px;padding:10px 12px;font-size:.92rem}
.choix-emp{border:2px dashed var(--rose);border-radius:10px;padding:10px 12px;font-size:.95rem}
.choix-emp.fait{border-style:solid;border-color:var(--vert);background:#d5e8dd}
.regle{background:var(--rose-clair);border-radius:10px;padding:10px 12px}
.regle .etiquette{margin-bottom:6px}
.regle p{margin:0;font-size:.95rem}
.regarder{font-size:.92rem}
.regarder ul{margin:4px 0 0;padding-left:20px}
.fiche{margin:6px 0 0;padding-left:18px;font-size:.88rem}
.retour{border-radius:10px;padding:10px 12px;background:#fdf0d8;font-size:.93rem}
.retour.ok{background:#d5e8dd}
.canvas3d{width:100%;height:auto;display:block;border-radius:10px;cursor:grab;touch-action:none}
.canvas3d:focus-visible{outline:3px solid var(--rose)}
.raisons{display:grid;gap:6px}
.raison{text-align:left;border:2px solid var(--sauge);background:#fff;border-radius:10px;padding:9px 12px;cursor:pointer;font-size:.93rem}
.raison:hover{background:var(--sauge-clair)}
.raison.juste{border-color:var(--vert);background:#d5e8dd;font-weight:600}
.raison.fausse{border-color:#e0a02b;background:#fdf0d8;font-weight:600}
.nav-etapes{justify-content:space-between}
.btn:disabled{opacity:.45;cursor:not-allowed}
.liste-etapes{margin:4px 0 0;padding:10px 0 0;border-top:2px solid var(--sauge-clair);list-style:none;display:grid;gap:2px;counter-reset:et}
.liste-etapes li{counter-increment:et}
.liste-etapes button{border:0;background:none;text-align:left;width:100%;padding:4px 6px;border-radius:8px;font-size:.88rem;cursor:pointer;color:var(--gris)}
.liste-etapes button::before{content:counter(et)". "}
.liste-etapes li.faite button{color:var(--vert-fonce)}
.liste-etapes li.faite button::after{content:" ✔"}
.liste-etapes li.courante button{background:var(--rose-clair);color:var(--encre);font-weight:700}
.liste-etapes button:disabled{opacity:.5;cursor:default}
.legende-plan{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--gris);margin-top:8px}
.legende-plan span{display:inline-flex;align-items:center;gap:5px}
.pastille{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.65rem;font-weight:700}
.panneau{background:#fff;border:2px solid var(--sauge);border-radius:var(--rayon);padding:14px;display:grid;gap:12px}
.panneau h3{margin:0}
.catalogue{display:grid;gap:6px}
.catalogue button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;border:2px solid var(--sauge);background:var(--papier);border-radius:10px;padding:7px 10px;cursor:pointer}
.catalogue button:hover{background:var(--sauge-clair)}
.catalogue small{color:var(--gris);white-space:nowrap}
.catalogue .groupe{font-size:.82rem;color:var(--gris);margin:6px 0 0}
.selection{background:var(--rose-clair);border-radius:12px;padding:12px;display:grid;gap:8px}
.selection select{border:2px solid var(--sauge);border-radius:10px;padding:8px;background:#fff}
.ligne-btn{display:flex;flex-wrap:wrap;gap:6px}
.definitions{font-size:.82rem;color:var(--gris);margin:0;padding-left:18px}
.verif{margin-top:18px;background:var(--sauge-clair);border-radius:var(--rayon);padding:16px 18px}
.verif-tete{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.messages{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.messages li{background:#fff;border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}
.messages li.ok{background:#d5e8dd}
.messages .ic{flex:none;font-size:1.1rem;line-height:1.3}
.score{font-weight:700}

.travail-s5{display:grid;gap:14px}
.apercu-svg{width:100%;height:auto;display:block}
.apercu-svg.etiq{max-width:420px;margin:0 auto}
.apercu-svg.affiche{max-width:300px;margin:0 auto}
.coches{display:grid;gap:6px}
.coches label{display:flex;gap:10px;align-items:flex-start;background:var(--papier);border:2px solid var(--sauge);border-radius:10px;padding:8px 10px;cursor:pointer}
.coches input{width:20px;height:20px;accent-color:var(--vert);flex:none;margin-top:2px}
.champs-ligne{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}
.tri{display:grid;gap:8px}
.ligne-tri{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;background:var(--papier);border-radius:10px;padding:6px 10px}
.ligne-tri .puces{margin:0}
.messages.compact li{padding:7px 10px;font-size:.9rem}
.apercu-svg.etiq{max-width:520px;margin:0 auto}
.apercu-svg.gondole{max-width:760px;margin:0 auto}
.zone-s5{cursor:pointer}
.zone-s5:hover rect:first-child{fill:rgba(239,134,171,.45)}
.produit-s5{cursor:pointer}
.produit-s5:hover rect{filter:brightness(1.1)}
.palette-s5{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.type-ILV,.type-PLV{display:inline-block;font-size:.72rem;font-weight:800;border-radius:6px;padding:1px 6px;color:#fff}
.type-ILV{background:#2e6fa7}.type-PLV{background:#c2185b}
.mode[aria-pressed="true"] .type-ILV,.mode[aria-pressed="true"] .type-PLV{outline:2px solid #fff}
.note-direction{background:#fff8e1;border:2px solid #e8c35b;border-radius:12px;padding:12px 16px}
.note-direction p{margin:6px 0 0}
.fiche-anom{display:grid;gap:10px}
.fiche-anom select{border:2px solid var(--sauge);border-radius:10px;padding:8px;background:#fff}
.bilan-grille{display:grid;grid-template-columns:1fr 1.4fr;gap:12px;align-items:start}
@media (max-width:900px){.bilan-grille{grid-template-columns:1fr}}
.bilan-grille figure{margin:0;background:#fff;border:2px solid var(--sauge);border-radius:12px;padding:8px}
.bilan-grille figcaption{text-align:center;font-weight:700;font-size:.9rem;margin-top:6px}
.atelier-client{grid-template-columns:minmax(0,1fr) 340px}
.carte-client{background:#fff;border:3px solid var(--rose);border-radius:14px;padding:16px;text-align:center;box-shadow:0 4px 0 var(--rose-clair)}
.carte-client .pic{font-size:2.6rem;display:block}
.carte-client p{margin:8px 0 0;font-size:1.12rem;font-weight:600}
.consignes-client{margin:4px 0 0;padding-left:20px;font-size:.93rem}
.score-client{font-size:1.4rem;font-weight:800;color:var(--vert-fonce);margin:0}
.i-cartes{display:grid;grid-template-columns:1fr 1fr;gap:4mm;align-content:start}
.i-carte{border:2px dashed #c2185b;border-radius:4mm;padding:4mm;text-align:center;font-size:10.5pt;font-weight:600}
.i-carte span{font-size:18pt;display:block}
.i-carte p{margin:2mm 0 0}
#zoneImpression{display:none}
#zoneImpression.rendu-pdf{display:block;position:fixed;left:-10000px;top:0;width:1123px;background:#fff}
#zoneImpression.rendu-pdf .page-impr{width:1123px;min-height:760px;max-height:none;padding:20px;box-sizing:border-box;background:#fff}
@page{size:A4 landscape;margin:8mm}
@media print{
  body.mode-impression > *:not(#zoneImpression){display:none!important}
  body.mode-impression #zoneImpression{display:block}
  body{background:#fff}
}
.page-impr{font-size:10pt;color:#1d2a24}
.i-tete{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:3px solid #1b6b46;padding-bottom:4px;margin-bottom:6px}
.i-tete h1{font-size:15pt;margin:0;color:#12492f}
.i-tete p{margin:0;font-size:9pt}
.i-corps{display:grid;grid-template-columns:1.25fr 1fr;gap:8mm}
.plan-impr{width:100%;height:auto;max-height:100mm;display:block}
.page-impr{page-break-inside:avoid;break-inside:avoid;max-height:190mm;overflow:hidden}
.i-3d{width:auto;max-width:100%;height:62mm;object-fit:contain;display:block;margin:4px auto 0;border-radius:6px}
.i-droite h2{font-size:11pt;margin:0 0 4px;color:#12492f;background:#fbe3ec;display:inline-block;padding:1px 8px;border-radius:5px}
.i-droite section{margin-bottom:6px}
.i-bande{display:flex;height:10mm;border-radius:4px;overflow:hidden;margin-bottom:4px}
.i-bande span{flex:1}
.i-produits{display:flex;gap:4px;margin-bottom:4px}
.i-produits img{width:22mm;height:22mm;object-fit:cover;border-radius:4px}
.i-grille{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.i-etiq{background:#e3efe8;border-radius:4px;padding:2px 5px;font-size:8.5pt}
.i-etiq b{display:block;font-size:7pt;color:#5d6b64}
.i-mots{font-weight:700;text-align:center;margin:4px 0}
.i-just{font-style:italic;margin:0;font-size:9pt}
.i-choix{margin:0;padding-left:14px;font-size:8.8pt}
.i-choix li{margin-bottom:2px}
.i-choix em{color:#12492f}
/* Bientôt */
.bientot{grid-column:1/-1;background:#fff;border:2px dashed var(--sauge);border-radius:var(--rayon);padding:32px;text-align:center}
.bientot p{margin:6px 0;color:var(--gris)}

    missions:{},
    ouverts:{accueil:true,enseigne:true,moodboard:false,plan:false,vitrine:false,client:false},

      odeurs:[], odeurAutre:'', odeursPq:'',

    maj:null
  };
}
let etat = charger() || etatVide();
let ongletActif = 'accueil';

function charger(){
  try{
    const brut = localStorage.getItem(CLE_STOCKAGE);
    if(!brut) return null;
    return fusion(etatVide(), JSON.parse(brut));
  }catch(e){ return null; }
}
function fusion(base, donnees){
  if(!donnees || typeof donnees !== 'object') return base;
  for(const k of Object.keys(base)){
    if(donnees[k] === undefined) continue;
    if(base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) base[k] = fusion(base[k], donnees[k]);
    else base[k] = donnees[k];
  }
  return base;
}
let minuterie = null;
function sauver(){
  etat.maj = new Date().toISOString();
  clearTimeout(minuterie);
  minuterie = setTimeout(()=>{
    try{
      localStorage.setItem(CLE_STOCKAGE, JSON.stringify(etat));
      statut("Enregistré automatiquement sur cet ordinateur. Pensez à enregistrer votre fichier en fin de séance.");
    }catch(e){
      statut("La sauvegarde automatique n'a pas fonctionné : enregistrez votre fichier maintenant.");
    }
  }, 400);
}
function statut(t){ document.getElementById('statut').textContent = t; }

/* =========================================================
   OUTILS
   ========================================================= */
const el = (tag, attrs={}, ...enfants) => {
  const n = document.createElement(tag);
  for(const [k,v] of Object.entries(attrs)){
    if(k === 'class') n.className = v;
    else if(k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if(v === true) n.setAttribute(k,'');
    else if(v !== false && v != null) n.setAttribute(k, v);
  }
  for(const e of enfants.flat()){ if(e == null) continue; n.append(e.nodeType ? e : document.createTextNode(e)); }
  return n;
};
const prenoms = () => [etat.binome.e1.trim() || 'Élève 1', etat.binome.e2.trim() || 'Élève 2'];

function parler(texte){
  if(!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texte);
  u.lang = 'fr-FR'; u.rate = .95;
  speechSynthesis.speak(u);
}

function redimensionner(fichier, max=520){
  return new Promise((ok, ko)=>{
    const lecteur = new FileReader();
    lecteur.onerror = ko;
    lecteur.onload = () => {
      const img = new Image();
      img.onerror = ko;
      img.onload = () => {
        const r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width*r); c.height = Math.round(img.height*r);
        c.getContext('2d').drawImage(img,0,0,c.width,c.height);
        ok(c.toDataURL('image/jpeg', .82));
      };
      img.src = lecteur.result;
    };
    lecteur.readAsDataURL(fichier);
  });
}

function rendreEquipe(){
  const [a,b] = prenoms();

    etat.enseigne ? el('span',{class:'badge'}, ENSEIGNES[etat.enseigne].pic+' ', el('strong',{}, ENSEIGNES[etat.enseigne].nom)) : null,
    el('span',{class:'badge'}, 'Pilote : ', el('strong',{}, pilote)),
    el('span',{class:'badge'}, 'Copilote : ', el('strong',{}, copilote))

}

function rendreOnglets(){

      onclick:()=>{ if(!ouvert) return; ongletActif=o.id; rendre(); window.scrollTo({top:0}); }

  }));

function blocMission(id){

  return el('aside',{class:'mission','aria-label':'Mission du jour'},
    el('span',{class:'etiquette'}, 'Mission du jour'),

function moodVide(){
  const m = etat.mood;
  return !(m.couleurs.length || m.matieres.length || m.lumiere || m.sons.length || m.odeurs.length ||
           m.produits.some(p=>p.img||p.nom) || m.mots.some(Boolean));
}
function demander(texte, oui='Oui'){
  const d = document.getElementById('dlgConfirmer');
  document.getElementById('confirmerTexte').textContent = texte;
  document.getElementById('confirmerOui').textContent = oui;
  return new Promise(ok=>{
    const fin = v => { d.close(); btnO.onclick = btnN.onclick = null; d.oncancel = null; ok(v); };
    const btnO = document.getElementById('confirmerOui'), btnN = document.getElementById('confirmerNon');
    btnO.onclick = ()=>fin(true); btnN.onclick = ()=>fin(false); d.oncancel = ev=>{ ev.preventDefault(); fin(false); };
    d.showModal(); btnN.focus();
  });
}
async function choisirEnseigne(id){
  const planCommence = !!etat.plan.caisse || Object.values(etat.plan.choix||{}).some(c=>c && c.slot) || (etat.plan.chemin||[]).length;
  if(etat.enseigne && etat.enseigne!==id && (!moodVide() || planCommence)){
    if(!await demander("Vous avez déjà commencé à travailler pour "+ENSEIGNES[etat.enseigne].nom+". Changer d'enseigne ? Le moodboard sera gardé mais sera à revoir, et le plan repartira de zéro, car chaque enseigne a son propre agencement.", "Changer d'enseigne")) return;
  }
  if(etat.enseigne !== id){ etat.plan = etatVide().plan; etat.vitrine = etatVide().vitrine; etat.client = {}; }
  etat.enseigne = id; sauver(); rendre();
}

function puces(liste, tableau, unique){
  return el('div',{class:'puces'}, liste.map(v=>
    el('button',{class:'puce', type:'button', 'aria-pressed':String(unique ? tableau()===v : tableau().includes(v)), onclick:ev=>{
      if(unique){ etat.mood.lumiere = etat.mood.lumiere===v ? '' : v; }
      else{
        const t = tableau(); const i = t.indexOf(v);
        i>=0 ? t.splice(i,1) : t.push(v);
      }
      majCase(ev.target);
      if(unique) ev.target.parentNode.querySelectorAll('.puce').forEach(b=>b.setAttribute('aria-pressed', String(etat.mood.lumiere===b.textContent)));
      else ev.target.setAttribute('aria-pressed', String(tableau().includes(v)));
    }}, v)));
}

function contenuCase(c){
  const m = etat.mood;
  switch(c.id){
    case 'couleurs':{
      const zone = el('div',{class:'palette'});
      const dessiner = () => {
        zone.replaceChildren(...[
          ...m.couleurs.map((col,i)=>el('div',{class:'couleur'},
            el('input',{type:'color', value:col, 'aria-label':'Couleur '+(i+1), oninput:ev=>{ m.couleurs[i]=ev.target.value; majCase(zone); }}),
            el('button',{type:'button', onclick:()=>{ m.couleurs.splice(i,1); dessiner(); majCase(zone); }}, 'Retirer'))),
          m.couleurs.length<5 ? el('button',{class:'btn', type:'button', onclick:()=>{ m.couleurs.push(['#b9d4c7','#1b6b46','#ef86ab','#c9b79c','#f3efe6'][m.couleurs.length%5]); dessiner(); majCase(zone); }}, '+ Ajouter une couleur') : null
        ].filter(Boolean));
      };
      dessiner();
      return zone;
    }
    case 'matieres': return puces(MATIERES, ()=>m.matieres, false);
    case 'lumiere':  return puces(LUMIERES, ()=>m.lumiere, true);
    case 'sons': return el('div',{}, puces(SONS, ()=>m.sons, false),
      el('label',{class:'champ'}, 'Autre (précisez)', el('input',{type:'text', value:m.sonAutre, oninput:ev=>{ m.sonAutre=ev.target.value; majCase(ev.target); }})));
    case 'odeurs': return el('div',{}, puces(ODEURS, ()=>m.odeurs, false),
      el('label',{class:'champ'}, 'Autre (précisez)', el('input',{type:'text', value:m.odeurAutre, oninput:ev=>{ m.odeurAutre=ev.target.value; majCase(ev.target); }})));
    case 'produits': return el('div',{class:'produits'}, m.produits.map((p,i)=>{
      const entree = el('input',{type:'file', accept:'image/*', class:'cache', onchange:async ev=>{
        const f = ev.target.files[0]; if(!f) return;
        try{ p.img = await redimensionner(f); vignette.style.backgroundImage = `url(${p.img})`; vignette.textContent=''; majCase(vignette); }
        catch(e){ statut("Cette image n'a pas pu être ouverte. Essayez une photo au format JPG ou PNG."); }
        ev.target.value='';
      }});
      const vignette = el('div',{class:'img', role:'button', tabindex:'0', 'aria-label':'Ajouter une photo '+(i+1),
        onclick:()=>entree.click(), onkeydown:ev=>{ if(ev.key==='Enter'||ev.key===' '){ev.preventDefault(); entree.click();} }},
        p.img ? '' : '+ Ajouter une photo');
      if(p.img) vignette.style.backgroundImage = `url(${p.img})`;
      return el('div',{class:'produit'}, vignette, entree,
        el('input',{type:'text', placeholder:'Nom du produit', value:p.nom, oninput:ev=>{ p.nom=ev.target.value; majCase(ev.target); }}),
        el('button',{class:'retirer', type:'button', onclick:()=>{ p.img=''; p.nom=''; rendre(); }}, 'Retirer'));
    }));
    case 'mots': return el('div',{class:'mots'}, m.mots.map((x,i)=>
      el('input',{type:'text', value:x, maxlength:'20', 'aria-label':'Mot '+(i+1), placeholder:'Mot '+(i+1), oninput:ev=>{ m.mots[i]=ev.target.value; majCase(ev.target); }})));
    case 'style':{
      const mur = el('div',{class:'mur'}); const sol = el('div',{class:'sol'});
      const peindre = () => { mur.style.background = m.murs; sol.style.background = m.sol; };
      peindre();
      return el('div',{class:'piece'},
        el('div',{class:'mini-piece','aria-hidden':'true'}, mur, sol),
        el('label',{class:'champ'}, 'Murs', el('input',{type:'color', value:m.murs, oninput:ev=>{ m.murs=ev.target.value; peindre(); majCase(ev.target); }})),
        el('label',{class:'champ'}, 'Sol', el('input',{type:'color', value:m.sol, oninput:ev=>{ m.sol=ev.target.value; peindre(); majCase(ev.target); }})));
    }
  }
}

function majCase(noeud){
  const carte = noeud.closest('.case');
  if(carte){
    const c = CASES.find(x=>x.id===carte.dataset.case);
    const ok = caseComplete(c);
    carte.classList.toggle('complete', ok);
    carte.querySelector('.coche').textContent = ok ? '✔ Case complète' : 'À compléter';
  }
  sauver(); rendreApercu();
}

function pageMoodboard(){
  if(!etat.enseigne) return el('div',{class:'vide'}, "Choisissez d'abord votre enseigne dans l'onglet « Mon enseigne ».");
  const e = ENSEIGNES[etat.enseigne];
  const cases = el('div',{class:'cases'}, CASES.map(c=>{
    const ok = caseComplete(c);
    return el('div',{class:'case'+(ok?' complete':''), 'data-case':c.id},
      el('div',{class:'case-tete'}, el('h3',{}, c.titre), el('span',{class:'coche'}, ok?'✔ Case complète':'À compléter')),
      el('p',{class:'aide'}, c.aide),
      contenuCase(c)
    );
  }));
  const bilanMood = el('div',{class:'case'+((etat.mood.pqGlobal||'').trim().length>=10?' complete':''), id:'caseGlobale'},
    el('div',{class:'case-tete'}, el('h3',{}, 'Pour finir : votre justification')),
    el('p',{class:'aide'}, "En deux phrases : pourquoi cette ambiance correspond-elle à votre enseigne et à ses clients ?"),
    el('textarea',{placeholder:"Exemple : Nous avons choisi… parce que les clients de l'enseigne…", oninput:ev=>{ etat.mood.pqGlobal = ev.target.value;
      document.getElementById('caseGlobale').classList.toggle('complete', ev.target.value.trim().length>=10); sauver(); }}, etat.mood.pqGlobal||''));
  const rappel = el('div',{class:'exigences', style:'margin:0 0 14px'},
    el('span',{class:'etiquette'}, 'Rappel du brief — '+e.nom),
    el('ul',{}, e.exigences.map(x=>el('li',{},x))));
  return el('div',{class:'mood'},
    el('section',{}, el('h2',{}, 'Le moodboard de votre magasin'), rappel, cases, bilanMood),
    el('aside',{class:'apercu', id:'apercu','aria-label':'Aperçu du moodboard'})
  );
}

function rendreApercu(){
  const z = document.getElementById('apercu'); if(!z) return;
  const m = etat.mood; const e = ENSEIGNES[etat.enseigne];
  const nb = CASES.filter(caseComplete).length;
  const etiq = (t, v) => el('div',{class:'etiq'}, el('b',{}, t), v || '—');
  const planche = el('div',{class:'planche'},
    el('div',{class:'titre'}, el('span',{'aria-hidden':'true'}, e.pic), e.nom),
    el('div',{class:'bande'}, m.couleurs.length ? m.couleurs.map(c=>el('div',{style:`background:${c}`})) : el('div',{})),
    ...m.produits.map(p=>el('div',{class:'im', style:p.img?`background-image:url(${p.img})`:'', title:p.nom})),
    etiq('Matières', m.matieres.join(', ')),
    etiq('Lumière', m.lumiere),
    etiq('Son', [...m.sons, m.sonAutre.trim()].filter(Boolean).join(', ')),
    etiq('Odeur', [...m.odeurs, m.odeurAutre.trim()].filter(Boolean).join(', ')),
    el('div',{class:'bande', style:'height:28px'}, el('div',{style:`background:${m.murs}`}), el('div',{style:`background:${m.sol}`})),
    el('div',{class:'motsap'}, m.mots.filter(x=>x.trim()).join(' · ') || 'Vos trois mots')
  );
  z.replaceChildren(
    el('span',{class:'etiquette'}, 'Aperçu'),
    planche,
    el('p',{class:'progression'}, `${nb} case${nb>1?'s':''} complète${nb>1?'s':''} sur ${CASES.length}`,
      el('div',{class:'barre'}, el('div',{style:`width:${Math.round(nb/CASES.length*100)}%`})))
  );
}

let pinceau = 'c', montrerIndice = false, resultats = null;
const NS = 'http://www.w3.org/2000/svg';
function sv(tag, attrs={}, ...enfants){
  const n = document.createElementNS(NS, tag);
  for(const [k,v] of Object.entries(attrs)) if(v != null && v !== false) n.setAttribute(k, v);
  for(const e of enfants.flat()){ if(e == null) continue; n.append(e.nodeType ? e : document.createTextNode(e)); }
  return n;
}
const centre = b => ({x:b.x+b.w/2, y:b.y+b.h/2});
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const arrondi = (v,pas=0.5) => Math.round(v/pas)*pas;
function distBoite(p, b){
  const dx = Math.max(b.x - p.x, 0, p.x - (b.x+b.w));
  const dy = Math.max(b.y - p.y, 0, p.y - (b.y+b.h));
  return Math.hypot(dx, dy);
}
const planEtat = () => { const P = etat.plan; P.choix = P.choix || {}; P.caisse = P.caisse || null; P.chemin = P.chemin || []; P.zones = P.zones || {}; P.etape = P.etape || 0; return P; };
const emp = n => emps().find(s=>s.n===n);
const CAISSE = {w:2.6, h:1};
function boiteCaisse(){ const c = planEtat().caisse; if(!c) return null;
  return {n:0, nom:'Caisse', x:c.x, y:c.y, w:c.r?CAISSE.h:CAISSE.w, h:c.r?CAISSE.w:CAISSE.h}; }

/* Meubles déduits des choix : un par étape placée, les emplacements restants = autres produits */
function meublesPlan(){
  const P = planEtat(), liste = [], pris = new Set();
  const bc = boiteCaisse();
  if(bc) liste.push({id:'caisse', fam:'', label:'Caisse', c:'#6b4f3a', box:bc, haut:false, slot:0});
  for(const et of etapesPlan()){
    const ch = P.choix[et.id];
    if(et.type!=='place' || !ch || !ch.slot) continue;
    const s = emp(ch.slot); pris.add(s.n);
    liste.push({id:et.id, fam:et.fam||'', label:et.label, c:et.c, box:s, haut:!!(s.mur||s.haut), slot:s.n});
  }
  for(const s of emps()) if(!pris.has(s.n)) liste.push({id:'autre'+s.n, autre:true, fam:'', label:s.defaut, c:'#b8c2bd', box:s, haut:!!(s.mur||s.haut), slot:s.n});
  return liste;
}
const etapesPlacees = () => etapesPlan().filter(e=>e.type==='place');
const toutPlace = () => etapesPlacees().every(e=>planEtat().choix[e.id]?.slot);

/* ----- Calcul des zones à partir de l'aménagement ----- */
function grilleObstacles(meubles){
  const obst = [RESERVE, ...VITRINES, ...decors(), ...meubles.map(m=>m.box)];
  const bloque = [];
  for(let y=0;y<H;y++){ bloque[y]=[]; for(let x=0;x<L;x++){
    const c = {x:x+.5, y:y+.5};
    bloque[y][x] = obst.some(b => c.x>b.x && c.x<b.x+b.w && c.y>b.y && c.y<b.y+b.h);
  }}
  return bloque;
}
function distancesMarche(bloque){
  const d = Array.from({length:H}, ()=>Array(L).fill(Infinity)), file = [];
  for(let x=Math.floor(PORTE.x); x<PORTE.x+PORTE.w; x++) if(!bloque[H-1][x]){ d[H-1][x]=1; file.push([x,H-1]); }
  while(file.length){
    const [x,y] = file.shift();
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=L||ny>=H||bloque[ny][nx]||d[ny][nx]!==Infinity) continue;
      d[ny][nx] = d[y][x]+1; file.push([nx,ny]);
    }
  }
  return d;
}
function calculerZones(avecAppel=true){
  const meubles = meublesPlan();
  const bloque = grilleObstacles(meubles), marche = distancesMarche(bloque);
  const caisse = meubles.find(m=>m.id==='caisse');
  const appels = meubles.filter(m=>m.fam==='appel').map(m=>m.box);
  const z = {};
  for(let y=0;y<H;y++) for(let x=0;x<L;x++){
    if(bloque[y][x] || marche[y][x]===Infinity) continue;
    const c = {x:x+.5, y:y+.5}; let h = 0;
    const dEnt = dist(c, ENTREE);
    if(dEnt <= 4.5) h += 2;                                        // abords de l'entrée
    if(c.x > 10.5 && c.y > 5) h += 1;                              // côté droit, sens naturel de circulation
    if(c.x >= 8 && c.x <= 12) h += 1;                              // allée centrale depuis l'entrée
    if(caisse && distBoite(c, caisse.box) <= 2.5) h += 2;           // abords de la caisse
    if(c.y < 5.5) h -= 1;                                          // fond du magasin
    if((c.x < 3 || c.x > 17) && c.y < 6) h -= 2;                   // angles du fond
    if(marche[y][x] > dEnt*1.6 + 3) h -= 1;                        // recoin caché derrière des meubles
    if(avecAppel && appels.some(b=>distBoite(c,b) <= 2.5)) h += 2; // réchauffé par un produit d'appel
    if(etat.enseigne==='normal') h += 1;                          // parcours imposé : le client passe partout
    z[x+','+y] = h >= 2 ? 'c' : (h <= -1 ? 'f' : 't');
  }
  return {zones:z, marche};
}

/* ----- Vérification ----- */
function verifierPlan(){
  const P = planEtat(), M = meublesPlan(), R = [];
  const ok = t => R.push({ok:true, t}), q = t => R.push({ok:false, t});
  const {zones, marche} = calculerZones(true);
  const base = calculerZones(false).zones;
  const get = id => M.find(m=>m.id===id);
  const zoneDe = zoneAutour;
  const marcheVers = b => { let best = Infinity;
    for(let y=Math.floor(b.y)-1;y<=Math.ceil(b.y+b.h);y++) for(let x=Math.floor(b.x)-1;x<=Math.ceil(b.x+b.w);x++)
      if(y>=0&&y<H&&x>=0&&x<L) best = Math.min(best, marche[y][x]);
    return best; };
  const pres = (id, r) => { const m = get(id); return m && dist(centre(m.box), ENTREE) <= r; };

  const caisse = get('caisse');
  if(caisse) dist(centre(caisse.box), ENTREE) > 7
    ? q("La caisse est loin de la sortie. Par où passe le client quand il a fini ses achats ?")
    : ok("La caisse est sur le chemin de la sortie.");

  const appel = get('appel');
  if(appel) zoneDe(appel.box, base)==='c'
    ? q("Vos produits d'appel sont déjà dans une zone où le client passe naturellement. Attirent-ils le client là où il ne serait pas allé seul ?")
    : ok("Les produits d'appel attirent le client vers une zone moins fréquentée.");
  const imp = get('impulsion');
  if(imp && caisse) distBoite(centre(caisse.box), imp.box) > 4
    ? q("Les produits d'impulsion sont loin de la caisse. Que regarde un client qui attend pour payer ?")
    : ok("Les produits d'impulsion attendent le client près de la caisse.");
  const refl = get('reflexion');
  if(refl) (dist(centre(refl.box), ENTREE) < 6.5)
    ? q("Les produits de réflexion sont juste à l'entrée, là où les clients passent vite. Où pourront-ils prendre le temps de comparer ?")
    : ok("Les produits de réflexion sont dans un endroit plus calme.");
  const nec = get('necessite');
  if(nec){
    if(etat.enseigne==='city') marcheVers(nec.box) > 12
      ? q("Les produits de première nécessité sont loin de l'entrée. Un client pressé les trouvera-t-il vite ?")
      : ok("Un client pressé trouve vite la première nécessité.");
    else zoneDe(nec.box, base)==='c'
      ? q("La première nécessité est tout près de l'entrée. Le client verra-t-il le reste du magasin s'il trouve tout de suite ce qu'il cherche ?")
      : ok("Pour trouver la première nécessité, le client traverse une partie du magasin.");
  }

  const E = etat.enseigne;
  if(E==='nd'){
    pres('ambiance',7) ? ok("La fontaine et le coin tisane accueillent le client dès l'entrée.")
      : q("Le brief demande que l'odeur et le son se perçoivent dès l'entrée. Le client les percevra-t-il en entrant ?");
    const es = get('essai');
    if(es) zoneDe(es.box, base)==='f' ? q("Le présentoir « à essayer » est dans un coin peu fréquenté. Les clients le trouveront-ils ?") : ok("Le présentoir « à essayer » est visible.");
  }
  if(E==='normal'){
    const ch = P.chemin;
    if(ch.length < 3) q("Le parcours à sens unique n'est pas encore tracé.");
    else {
      caisse && dist(ch[ch.length-1], centre(caisse.box)) > 3.5 ? q("Le parcours ne se termine pas à la caisse. Où arrive le client à la fin de son tour ?") : ok("Le parcours se termine à la caisse.");
      const prochePoint = b => { for(let i=1;i<ch.length;i++){ const a=ch[i-1], c=ch[i];
          for(let t=0;t<=1;t+=.1){ if(distBoite({x:a.x+(c.x-a.x)*t, y:a.y+(c.y-a.y)*t}, b) <= 2.5) return true; } } return false; };
      const oublies = M.filter(m=>!prochePoint(m.box)).length;
      oublies ? q(`Le parcours ne passe pas devant ${oublies} emplacement${oublies>1?'s':''}. Le brief dit que le client passe devant tous les rayons : est-ce le cas ?`) : ok("Le parcours passe devant tous les rayons.");
    }
  }
  if(E==='city'){
    pres('frais',7) ? ok("Le frais et la boulangerie se voient dès l'entrée.") : q("Le brief veut que le frais et la boulangerie se voient dès l'entrée. Qu'est-ce que le client voit en premier chez vous ?");
    if(caisse) dist(centre(caisse.box), ENTREE) > 7
      ? q("Le comptoir de services est loin de l'entrée. Un client qui vient seulement retirer un colis doit-il traverser tout le magasin ?")
      : ok("Le comptoir de services, avec la caisse, est tout près de l'entrée.");
  }
  if(E==='mdm'){
    const fond = M.filter(m=>centre(m.box).y < 5.5 && !m.autre);
    fond.length ? ok("Quelque chose attire le regard au fond du magasin.") : q("Le brief veut qu'on voie jusqu'au fond depuis l'entrée. Qu'y a-t-il au fond pour donner envie d'y aller ?");
  }

  const eleve = Object.entries(P.zones);
  if(!eleve.length) q("Vous n'avez pas colorié vos zones. Revenez à l'étape précédente pour faire vos prévisions.");
  else {
    let bon = 0, total = 0;
    for(const [k,v] of eleve){ const t = zones[k]; if(!t) continue; total++; if(t===v) bon++; }
    R.unshift({score:true, t:`Vos zones : ${bon} case${bon>1?'s':''} sur ${total} correspondent à l'analyse de votre plan.`});
  }
  return R;
}

/* ----- Dessin du plan ----- */
function dessinerPlan(){
  const svg = document.getElementById('svgPlan'); if(!svg) return;
  const P = planEtat(), etapes = etapesPlan(), et = etapes[Math.min(P.etape, etapes.length-1)];
  const place = et.type==='place', zonesVisibles = ['zones','verif'].includes(et.type);
  const M = meublesPlan(), g = [];
  g.push(sv('rect',{x:0,y:0,width:L,height:H,fill:etat.mood.sol||'#efe9dc'}));
  for(let x=1;x<L;x++) g.push(sv('line',{x1:x,y1:0,x2:x,y2:H,stroke:'rgba(0,0,0,.07)','stroke-width':.03}));
  for(let y=1;y<H;y++) g.push(sv('line',{x1:0,y1:y,x2:L,y2:y,stroke:'rgba(0,0,0,.07)','stroke-width':.03}));
  if(montrerIndice && et.type==='verif'){
    for(const [k,v] of Object.entries(calculerZones(true).zones)){ if(v==='t') continue; const [x,y]=k.split(',').map(Number);
      g.push(sv('rect',{x,y,width:1,height:1,fill:v==='c'?'rgba(214,40,57,.3)':'rgba(30,100,190,.42)'})); }
  }
  if(zonesVisibles) for(const [k,v] of Object.entries(P.zones)){ const [x,y]=k.split(',').map(Number);
    g.push(sv('rect',{x:x+.08,y:y+.08,width:.84,height:.84,rx:.12,fill:montrerIndice?'none':(v==='c'?'rgba(214,40,57,.35)':'rgba(30,100,190,.4)'),stroke:v==='c'?'#d62839':'#1e64be','stroke-width':.1})); }
  g.push(sv('rect',{x:RESERVE.x,y:RESERVE.y,width:RESERVE.w,height:RESERVE.h,fill:'#cfd6d2'}));
  g.push(sv('text',{x:RESERVE.w/2,y:RESERVE.h/2+.2,'text-anchor':'middle','font-size':.6,fill:'#4b5a53'},'Réserve'));
  g.push(sv('rect',{x:RESERVE.w-1.6,y:RESERVE.h-.12,width:1.2,height:.24,fill:'#fff'}));
  for(const v of VITRINES){
    g.push(sv('rect',{x:v.x,y:v.y,width:v.w,height:v.h,fill:'rgba(185,212,199,.55)',stroke:'#1b6b46','stroke-width':.05,'stroke-dasharray':'.2 .15'}));
    g.push(sv('text',{x:v.x+v.w/2,y:v.y+.8,'text-anchor':'middle','font-size':.5,fill:'#12492f'},'Vitrine'));
  }
  g.push(sv('path',{d:`M${PORTE.x} ${H} H0 V0 H${L} V${H} H${PORTE.x+PORTE.w}`,fill:'none',stroke:'#1d2a24','stroke-width':.25}));
  g.push(sv('text',{x:ENTREE.x,y:H+.75,'text-anchor':'middle','font-size':.55,fill:'#1b6b46','font-weight':700},'▲ Entrée'));
  g.push(sv('text',{x:L/2,y:H+1.45,'text-anchor':'middle','font-size':.42,fill:'#5d6b64'},'Façade sur la galerie — 20 m × 15 m'));

  for(const d of decors()){
    g.push(sv('rect',{x:d.x,y:d.y,width:d.w,height:d.h,fill:'#9aa59f',stroke:'#1d2a24','stroke-width':.06}));
    g.push(sv('text',{x:d.x+d.w/2,y:d.y+d.h/2+.15,'text-anchor':'middle','font-size':.42,fill:'#fff','font-weight':600}, d.label));
  }
  // emplacements
  for(const s of emps()){
    const m = M.find(x=>x.slot===s.n);
    const aMoi = place && P.choix[et.id]?.slot===s.n;
    const libre = m.autre;
    const cliquable = place && (libre || aMoi) && (!et.ilot || s.ilot);
    const grp = sv('g',{class:'emplacement'+(cliquable?' cliquable':'')+(aMoi?' choisi':''), 'data-n':s.n,
      tabindex:cliquable?'0':null, role:cliquable?'button':null, 'aria-label':cliquable?`Emplacement ${s.n} : ${s.nom}`:null});
    grp.append(sv('title',{}, `${s.n}. ${s.nom} — ${ficheEmplacement(s, place?et.id:'').join(', ')}`));
    const vert = s.h > s.w*1.5, long = (vert?s.h:s.w) - .5;
    const ecrire = (txt, couleur, poids) => {
      const epais = (vert?s.w:s.h);
      let lignes = [txt], fs = Math.max(.2, Math.min(.42, long/(txt.length*.58), epais*.45));
      const mots = txt.split(' ');
      if(fs < .34 && mots.length > 1 && epais >= 1.1){
        const mi = Math.ceil(mots.length/2); lignes = [mots.slice(0,mi).join(' '), mots.slice(mi).join(' ')];
        const max = Math.max(...lignes.map(l=>l.length));
        fs = Math.max(.2, Math.min(.42, long/(max*.58), epais*.3));
      }
      const cx = s.x+s.w/2+(vert?0:.15), cy = s.y+s.h/2+(vert?-.2:.1);
      const t = sv('text',{x:cx,y:cy,'text-anchor':'middle','font-size':fs,fill:couleur,'font-weight':poids,
        transform:vert?`rotate(-90 ${s.x+s.w/2} ${s.y+s.h/2})`:null});
      lignes.forEach((l,i)=>t.append(sv('tspan',{x:cx, y:cy + fs/3 + (i-(lignes.length-1)/2)*fs*1.15}, l)));
      grp.append(t);
    };
    if(!libre){
      grp.append(sv('rect',{class:'corps',x:s.x,y:s.y,width:s.w,height:s.h,rx:.12,fill:m.c,stroke:(s.mur||s.haut)?'#1d2a24':'rgba(0,0,0,.35)','stroke-width':(s.mur||s.haut)?.08:.04}));
      ecrire(m.label, '#fff', 600);
      if(m.fam){ const f = FAMILLES[m.fam];
        grp.append(sv('circle',{cx:s.x+s.w-.05,cy:s.y+.05,r:.32,fill:f.couleur,stroke:'#fff','stroke-width':.06}));
        grp.append(sv('text',{x:s.x+s.w-.05,y:s.y+.18,'text-anchor':'middle','font-size':.36,fill:'#fff','font-weight':700},f.lettre)); }
    } else {
      grp.append(sv('rect',{class:'corps',x:s.x,y:s.y,width:s.w,height:s.h,rx:.12,
        fill:cliquable?'rgba(239,134,171,.3)':'#dfe5e1',stroke:cliquable?'#c2185b':((s.mur||s.haut)?'#1d2a24':'#8a968f'),
        'stroke-width':cliquable?.09:((s.mur||s.haut)?.08:.04),'stroke-dasharray':cliquable?'.3 .18':null}));
      ecrire(s.defaut, '#3d4a44', 500);
    }
    grp.append(sv('circle',{cx:s.x+.38,cy:s.y+.38,r:.3,fill:'#fff',stroke:'#1d2a24','stroke-width':.04}));

    P.chemin.forEach((p,i)=>g.push(sv('circle',{cx:p.x,cy:p.y,r:i?.12:.22,fill:'#1b6b46'})));

function pointSvg(ev){
  const svg = document.getElementById('svgPlan');
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}
const croiseB = (a,b) => a.x < b.x+b.w && b.x < a.x+a.w && a.y < b.y+b.h && b.y < a.y+a.h;
const ZONE_PORTE = {x:8.3, y:13.2, w:3.4, h:1.8};
let erreurCaisse = '';
function placerCaisse(p, r){
  const P = planEtat();
  const rot = r ?? (P.caisse ? P.caisse.r : 0);
  const w = rot?CAISSE.h:CAISSE.w, h = rot?CAISSE.w:CAISSE.h;
  const b = {x:Math.min(Math.max(.2, arrondi(p.x - w/2)), L-.2-w), y:Math.min(Math.max(.2, arrondi(p.y - h/2)), H-.2-h), w, h};
  const obst = [RESERVE, ...VITRINES, ...decors(), ...emps(), ZONE_PORTE];
  if(obst.some(o=>croiseB(b,o))){
    erreurCaisse = "Pas assez de place ici : la caisse toucherait un rayon, la vitrine ou la porte. Cliquez sur un espace libre du sol.";
  } else { P.caisse = {x:b.x, y:b.y, r:rot}; erreurCaisse = ''; resultats = null; sauver(); }
  dessinerPlan(); dessinerPanneau();
}
function choisirEmplacement(n){
  const P = planEtat(), et = etapesPlan()[P.etape];
  if(et.type!=='place') return;
  const s = emp(n), m = meublesPlan().find(x=>x.slot===n);
  if(!m.autre && m.id!==et.id) return;
  if(et.ilot && !s.ilot) return;
  P.choix[et.id] = {...(P.choix[et.id]||{pq:''}), slot:n};
  resultats = null; sauver(); dessinerPlan(); dessinerPanneau();
}
function installerInteractions(svg){
  let peint = false;
  const peindre = p => {
    const x = Math.floor(p.x), y = Math.floor(p.y);
    if(x<0||y<0||x>=L||y>=H) return;
    const k = x+','+y, Z = planEtat().zones;
    if(pinceau==='x') delete Z[k]; else Z[k] = pinceau;
    dessinerPlan();
  };
  svg.addEventListener('pointerdown', ev=>{
    const P = planEtat(), et = etapesPlan()[P.etape];
    if(et.type==='caisse'){ placerCaisse(pointSvg(ev)); }
    else if(et.type==='place'){ const g = ev.target.closest('.emplacement.cliquable'); if(g) choisirEmplacement(Number(g.dataset.n)); }
    else if(et.type==='chemin'){
      const p = pointSvg(ev); if(p.x<0||p.y<0||p.x>L||p.y>H+.5) return;
      P.chemin.push({x:arrondi(p.x), y:Math.min(H,arrondi(p.y))}); sauver(); dessinerPlan(); dessinerPanneau();
    } else if(et.type==='zones'){ peint = true; svg.setPointerCapture(ev.pointerId); peindre(pointSvg(ev)); }
  });
  svg.addEventListener('pointermove', ev=>{ if(peint) peindre(pointSvg(ev)); });
  const fin = () => { if(peint){ peint=false; resultats=null; sauver(); } };
  svg.addEventListener('pointerup', fin); svg.addEventListener('pointercancel', fin);
  svg.addEventListener('keydown', ev=>{
    const g = ev.target.closest && ev.target.closest('.emplacement.cliquable');
    if(g && (ev.key==='Enter'||ev.key===' ')){ ev.preventDefault(); choisirEmplacement(Number(g.dataset.n)); }
  });
}



/* Raisons proposées après chaque choix du plan : une seule est juste */

const BONNE_RAISON = {caisse:1, appel:2, impulsion:0, reflexion:1, necessite_city:2, necessite:0, essai:1, ambiance:0, bacs:2, chemin:1, frais:0, piece:2, coeur:1};
const cleRaison = et => (et.id==='necessite' && etat.enseigne==='city') ? 'necessite_city' : et.id;
const raisonJuste = (et, ch) => ch.raison !== undefined && ch.raison === BONNE_RAISON[cleRaison(et)];

/* ----- Fiche d'un emplacement et retour immédiat ----- */
function zoneAutour(b, carte){
  const cpt = {c:0,t:0,f:0};
  for(let y=Math.floor(b.y)-1; y<=Math.ceil(b.y+b.h); y++) for(let x=Math.floor(b.x)-1; x<=Math.ceil(b.x+b.w); x++){ const v = carte[x+','+y]; if(v) cpt[v]++; }
  return cpt.c >= cpt.f && cpt.c >= cpt.t ? 'c' : (cpt.f >= cpt.t ? 'f' : 't');
}
function marcheJusqua(b, marche){
  let best = Infinity;
  for(let y=Math.floor(b.y)-1;y<=Math.ceil(b.y+b.h);y++) for(let x=Math.floor(b.x)-1;x<=Math.ceil(b.x+b.w);x++)
    if(y>=0&&y<H&&x>=0&&x<L) best = Math.min(best, marche[y][x]);
  return best;
}
function ficheEmplacement(s, etId){
  const c = centre(s), P = planEtat();
  const f = [];
  f.push(s.ilot ? 'Grand îlot au milieu' : (s.mur ? 'Contre un mur' : (s.haut ? 'Grande gondole qui guide le passage' : 'Meuble au milieu du passage')));
  f.push(c.y > 9 ? "À l'avant, près de l'entrée" : (c.y > 5.5 ? 'Au milieu du magasin' : 'Au fond du magasin'));
  f.push(c.x < 7 ? 'Côté gauche' : (c.x > 13 ? 'Côté droit' : 'Au centre'));
  f.push(`À environ ${Math.round(dist(c, ENTREE))} m de l'entrée`);
  const bc = boiteCaisse();
  if(bc && etId!=='caisse' && s.n) f.push(distBoite(centre(bc), s) <= 4 ? 'Juste à côté de la caisse' : 'Loin de la caisse');
  return f;
}
function verdictEtape(et){
  const P = planEtat();
  if(et.id==='caisse'){ const b = boiteCaisse(); if(!b) return null;
    return dist(centre(b), ENTREE) <= 7 && !croiseB(b, ZONE_PORTE); }
  const n = P.choix[et.id]?.slot; if(!n) return null;
  const s = emp(n), c = centre(s), {zones:base, marche} = calculerZones(false);
  const bc = boiteCaisse();
  switch(et.id){
    case 'appel':     return zoneAutour(s, base) !== 'c';
    case 'impulsion': return bc ? distBoite(centre(bc), s) <= 4 : null;
    case 'reflexion': return dist(c, ENTREE) >= 6.5;
    case 'necessite': return etat.enseigne==='city' ? marcheJusqua(s, marche) <= 12 : zoneAutour(s, base) !== 'c';
    case 'essai': case 'bacs': case 'coeur': return zoneAutour(s, base) !== 'f';
    case 'ambiance': case 'frais': return dist(c, ENTREE) <= 7;
    case 'services':  return marcheJusqua(s, marche) <= 12;
    default: return true;
  }
}

/* ----- Panneau des étapes ----- */
function etapeValide(et){
  const P = planEtat(), ch = P.choix[et.id] || {};
  if(et.type==='place') return !!ch.slot && raisonJuste(et, ch);
  if(et.type==='caisse') return !!P.caisse && raisonJuste(et, ch);
  if(et.type==='chemin') return P.chemin.length >= 3 && raisonJuste(et, ch);
  return true;
}
function allerA(i){
  if(vue==='3d') basculerVue('2d');

let vue = '2d', trois = null;

const LUMIERES_3D = {
  'Chaude':{c:0xffd9a8, i:.95}, 'Froide':{c:0xdce9ff, i:1}, 'Tamisée':{c:0xffe2bd, i:.6},
  'Vive':{c:0xffffff, i:1.25}, 'Naturelle':{c:0xfff6ea, i:1.05}
};
function etiquette3D(texte, fond){
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 128;
  const x = cv.getContext('2d');
  x.font = "700 44px Lexend, 'Segoe UI', Arial, sans-serif";
  const l = Math.min(500, x.measureText(texte).width + 40);
  x.fillStyle = fond || 'rgba(255,255,255,.92)';
  x.beginPath(); x.roundRect ? x.roundRect((512-l)/2, 24, l, 80, 24) : x.rect((512-l)/2, 24, l, 80); x.fill();
  x.fillStyle = fond ? '#ffffff' : '#1d2a24'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(texte, 256, 66, 480);
  const t = new THREE.CanvasTexture(cv);
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({map:t, depthTest:false, transparent:true}));
  sp.scale.set(4.4, 1.1, 1); sp.renderOrder = 10;
  return sp;
}
function construireScene(){
  const T = THREE, scene = new T.Scene();
  scene.background = new T.Color(0xeef3f0);
  const m = etat.mood;
  const lum = LUMIERES_3D[m.lumiere] || {c:0xffffff, i:.95};
  scene.add(new T.HemisphereLight(0xffffff, 0x8a8a8a, .55*lum.i));
  const dir = new T.DirectionalLight(lum.c, .75*lum.i); dir.position.set(6, 14, 18); scene.add(dir);
  const plaf = new T.PointLight(lum.c, .5*lum.i, 30); plaf.position.set(10, 3, 7.5); scene.add(plaf);

  const mat = (c, o={}) => new T.MeshLambertMaterial({color:new T.Color(c), ...o});
  // sol
  const sol = new T.Mesh(new T.PlaneGeometry(L, H), mat(m.sol || '#efe9dc'));
  sol.rotation.x = -Math.PI/2; sol.position.set(L/2, 0, H/2); scene.add(sol);
  // murs visibles de l'intérieur seulement (on voit à travers depuis l'extérieur)
  const HM = 3, murMat = mat(m.murs || '#f3efe6', {side:T.FrontSide});
  const mur = (x1,z1,x2,z2,y0=0,h=HM,materiau=murMat) => {
    const lg = Math.hypot(x2-x1, z2-z1); if(lg <= 0) return;
    const p = new T.Mesh(new T.PlaneGeometry(lg, h), materiau);
    p.position.set((x1+x2)/2, y0+h/2, (z1+z2)/2);
    p.rotation.y = Math.atan2(-(z2-z1), x2-x1);
    scene.add(p);
  };
  mur(0,0, L,0);          // fond (face visible tournée vers l'intérieur)
  mur(0,H, 0,0);          // gauche
  mur(L,0, L,H);          // droite
  // façade : piliers, vitrines vitrées, porte
  const verre = mat('#bfe3e8', {transparent:true, opacity:.25, side:T.DoubleSide});
  const segs = [[0,.5,'mur'],[.5,7.5,'vitrine'],[7.5,8.5,'mur'],[8.5,11.5,'porte'],[11.5,12.5,'mur'],[12.5,19.5,'vitrine'],[19.5,20,'mur']];
  for(const [a,b,t] of segs){
    if(t==='mur') mur(b,H, a,H);
    if(t==='vitrine'){ mur(b,H, a,H, 0,.5); mur(b,H, a,H, .5,2.1, verre); mur(b,H, a,H, 2.6,.4); }
    if(t==='porte') mur(b,H, a,H, 2.4,.6);
  }
  // réserve
  const res = new T.Mesh(new T.BoxGeometry(RESERVE.w, HM, RESERVE.h), mat('#cfd6d2'));
  res.position.set(RESERVE.x+RESERVE.w/2, HM/2, RESERVE.y+RESERVE.h/2); scene.add(res);
  const eres = etiquette3D('Réserve'); eres.position.set(RESERVE.w/2, HM+.3, RESERVE.h/2); scene.add(eres);
  // meubles
  const palette = m.couleurs.length ? m.couleurs : ['#c8cfcb'];
  meublesPlan().forEach((mb, i)=>{
    const s = mb.box, emp_ = emps().find(e=>e.n===mb.slot) || {};
    const haut = mb.id==='caisse' ? 1.05 : (mb.haut ? 1.9 : (emp_.ilot ? .75 : 1));
    const couleur = mb.autre ? palette[i % palette.length] : mb.c;
    const boite = new T.Mesh(new T.BoxGeometry(s.w, haut, s.h), mat(couleur));
    boite.position.set(s.x+s.w/2, haut/2, s.y+s.h/2); scene.add(boite);
    const arete = new T.LineSegments(new T.EdgesGeometry(boite.geometry), new T.LineBasicMaterial({color:0x33413a}));
    arete.position.copy(boite.position); scene.add(arete);
    const et = etiquette3D(mb.label, mb.fam ? FAMILLES[mb.fam].couleur+'ee' : null);
    et.position.set(s.x+s.w/2, haut+.45, s.y+s.h/2); scene.add(et);
  });
  // chemin du client
  const ch = planEtat().chemin;
  if(ch.length > 1){
    const pts = ch.map(p=>new T.Vector3(p.x, .03, p.y));
    scene.add(new T.Line(new T.BufferGeometry().setFromPoints(pts), new T.LineBasicMaterial({color:0x1b6b46})));
  }
  return scene;
}
async function afficher3D(){
  const zone = document.getElementById('zone3d'); if(!zone) return;
  zone.replaceChildren(el('p',{class:'aide', style:'padding:20px'}, 'Chargement de la vue 3D…'));
  try{ await chargerThree(); }
  catch(e){ zone.replaceChildren(el('div',{class:'vide'}, "La vue 3D n'a pas pu se charger. Vérifiez la connexion à Internet, puis réessayez.")); return; }
  const T = THREE;
  const largeur = zone.clientWidth || 800, hauteur = Math.round(largeur*.62);
  let renderer;
  try{ renderer = new T.WebGLRenderer({antialias:true, preserveDrawingBuffer:true}); }
  catch(e){ zone.replaceChildren(el('div',{class:'vide'}, "Cet ordinateur n'affiche pas la 3D (WebGL indisponible). Utilisez la vue 2D.")); return; }
  renderer.setPixelRatio(Math.min(2, window.devicePixelRatio||1));
  renderer.setSize(largeur, hauteur);
  const scene = construireScene();
  const cam = new T.PerspectiveCamera(55, largeur/hauteur, .1, 200);
  // caméra orbitale autour du centre du magasin
  const cible = new T.Vector3(L/2, 0, H/2);
  const orb = {az:.35, el:.85, d:24};
  let mode = 'orbite', client = {yaw:0, x:ENTREE.x, z:H+.8};
  const etiquettes = scene.children.filter(o=>o.isSprite);
  const placer = () => {
    etiquettes.forEach(e=>e.scale.set(mode==='orbite'?4.4:2.4, mode==='orbite'?1.1:.6, 1));
    if(mode==='orbite'){
      cam.position.set(cible.x + orb.d*Math.cos(orb.el)*Math.sin(orb.az), orb.d*Math.sin(orb.el), cible.z + orb.d*Math.cos(orb.el)*Math.cos(orb.az));
      cam.lookAt(cible); cam.fov = 55;
    } else {
      cam.position.set(client.x, 1.6, client.z);
      cam.lookAt(client.x + Math.sin(client.yaw)*-10, 1.35, client.z - Math.cos(client.yaw)*10); cam.fov = 70;
    }
    cam.updateProjectionMatrix(); renderer.render(scene, cam);
  };
  placer();
  const cv = renderer.domElement; cv.className = 'canvas3d'; cv.tabIndex = 0;
  cv.setAttribute('aria-label', 'Vue 3D du magasin. Faites glisser pour tourner.');
  let drag = null;
  cv.addEventListener('pointerdown', ev=>{ drag = {x:ev.clientX, y:ev.clientY}; cv.setPointerCapture(ev.pointerId); });
  cv.addEventListener('pointermove', ev=>{
    if(!drag) return;
    const dx = ev.clientX-drag.x, dy = ev.clientY-drag.y; drag = {x:ev.clientX, y:ev.clientY};
    if(mode==='orbite'){ orb.az -= dx*.008; orb.el = Math.min(1.45, Math.max(.15, orb.el + dy*.006)); }
    else client.yaw = Math.max(-1.3, Math.min(1.3, client.yaw + dx*.005));
    placer();
  });
  cv.addEventListener('pointerup', ()=>drag=null);
  cv.addEventListener('wheel', ev=>{ if(mode!=='orbite') return; ev.preventDefault(); orb.d = Math.min(40, Math.max(8, orb.d + ev.deltaY*.02)); placer(); }, {passive:false});
  cv.addEventListener('keydown', ev=>{
    const k = ev.key;
    if(mode==='orbite'){
      if(k==='ArrowLeft') orb.az += .1; else if(k==='ArrowRight') orb.az -= .1;
      else if(k==='ArrowUp') orb.el = Math.min(1.45, orb.el+.08); else if(k==='ArrowDown') orb.el = Math.max(.15, orb.el-.08); else return;
    } else {
      if(k==='ArrowLeft') client.yaw -= .1; else if(k==='ArrowRight') client.yaw += .1; else return;
    }
    ev.preventDefault(); placer();
  });
  const btn = (t, f, actif) => el('button',{class:'mode', type:'button', 'aria-pressed':String(!!actif), onclick:ev=>{
    ev.target.parentNode.querySelectorAll('.mode').forEach(b=>b.setAttribute('aria-pressed', String(b===ev.target))); f(); placer(); }}, t);
  const barre = el('div',{class:'modes'},
    btn("Vue d'ensemble", ()=>{ mode='orbite'; orb.az=.35; orb.el=.85; orb.d=24; }, true),
    btn('Vue de dessus', ()=>{ mode='orbite'; orb.az=0; orb.el=1.45; orb.d=22; }),
    btn('👁️ Entrer comme un client', ()=>{ mode='client'; client.yaw=0; }));
  const E = etat.enseigne;
  const question = {
    nd:"Depuis l'entrée, le client est-il invité à se promener ? Voit-il la fontaine et le coin tisane ?",
    normal:"Depuis l'entrée, le client voit-il par où avancer ? Peut-il échapper au parcours ?",
    city:"Depuis l'entrée, que voit le client en premier ? Est-ce le frais, comme le demande le brief ?",
    mdm:"Depuis l'entrée, voit-on jusqu'au fond du magasin ? Qu'est-ce qui attire le regard ?"
  }[E];
  zone.replaceChildren(barre, cv,
    el('p',{class:'note', style:'margin:6px 0 0'}, "Faites glisser pour tourner, molette pour zoomer. En vue client, faites glisser pour regarder à gauche ou à droite."),
    question ? el('div',{class:'regle', style:'margin-top:10px'}, el('span',{class:'etiquette'}, 'Mettez-vous à la place du client'), el('p',{}, question)) : null
  );
  trois = {renderer, scene, cam};
}

    if(manquent.length) q(`Il manque ${manquent.length} mention${manquent.length>1?'s':''} obligatoire${manquent.length>1?'s':''}.`);
    if(trop.length) q("Une information interne au magasin est sur l'étiquette. Le client en a-t-il besoin ?");

    const et = S5[E].etiq, att = arr2(et.prix/et.q), s = nombre(v.etiq.unite), u = et.unite==='kg'?'kilo':'litre';
    if(s===null) q(`Calculez le prix au ${u}.`);

    else ok(`Le prix au ${u} est juste : ${euros(att)} le ${et.unite}.`);

    else faux ? q(`${faux} réponse${faux>1?'s':''} du tri à revoir. Informe-t-il ou fait-il de la publicité ?`) : ok("Le tri ILV / PLV est juste.");

      if(trop.length) q("Une information inutile ou interne est sur l'étiquette. Le client en a-t-il besoin ?");

    }

    if(fausses.length) q(`${fausses.length} produit${fausses.length>1?'s signalés sont':' signalé est'} pourtant correct${fausses.length>1?'s':''}. Relisez son étiquette.`);

    else if(mauvaisType) q(`${mauvaisType} type${mauvaisType>1?'s':''} d'anomalie ${mauvaisType>1?'sont':'est'} à revoir.`);

const COUL_PROD = ['#c9a27e','#7cb342','#e8566c','#5ab4c5','#f2b233','#8e5bb5','#e79aa9','#4b7fa8'];

function gondole(o){
  const W = 100, Hh = 70, gx = 22, gw = 56, nb = o.rangs || 4, top = 11, pas = (Hh-6-top)/nb;
  const g = [];
  g.push(sv('rect',{x:0,y:Hh-6,width:W,height:6,fill:'#d9d2c4'}));
  g.push(sv('rect',{x:gx-1,y:top-1,width:gw+2,height:Hh-6-top+1,fill:'#eef1ef',stroke:'#8a968f','stroke-width':.3}));

    zr.append(sv('rect',{x:gx,y:base+.8,width:gw,height:3.4,fill:(o.zones||o.zoneReglette)&&!rg.etiq?'rgba(239,134,171,.22)':'#fff',stroke:(o.zones||o.zoneReglette)?'#c2185b':'#8a968f','stroke-width':.2,'stroke-dasharray':(o.zones||o.zoneReglette)?'1 .6':null}));

/* ----- Export PDF (A4 paysage) sans fenêtre d'impression ----- */
function chargerScript(src, test){
  return new Promise((ok, ko)=>{
    if(test()) return ok();
    const sc = document.createElement('script'); sc.src = src; sc.onload = ok; sc.onerror = ko; document.head.append(sc);
  });
}
async function telechargerPDF(page, nom, bouton){
  const texte = bouton ? bouton.textContent : '';
  if(bouton){ bouton.disabled = true; bouton.textContent = 'Création du PDF…'; }
  try{
    await chargerScript('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', ()=>!!window.html2canvas);
    await chargerScript('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js', ()=>!!(window.jspdf && window.jspdf.jsPDF));
    const zone = document.getElementById('zoneImpression');
    zone.replaceChildren(page); zone.classList.add('rendu-pdf');
    await new Promise(r=>setTimeout(r, 150));
    const canvas = await html2canvas(page, {scale:2, backgroundColor:'#ffffff', useCORS:true, logging:false});
    const doc = new jspdf.jsPDF({orientation:'landscape', unit:'mm', format:'a4'});
    const W = 297, Hp = 210, marge = 8, lMax = W-2*marge, hMax = Hp-2*marge;
    const ratio = Math.min(lMax/canvas.width, hMax/canvas.height);
    const l = canvas.width*ratio, h = canvas.height*ratio;
    doc.addImage(canvas.toDataURL('image/jpeg', .92), 'JPEG', (W-l)/2, marge, l, h);
    doc.save(nom);
    statut(`PDF « ${nom} » créé. Rangez-le dans votre espace personnel ou votre portfolio.`);
  }catch(e){
    statut("Le PDF n'a pas pu être créé. Vérifiez la connexion à Internet, puis réessayez.");
  }finally{
    document.getElementById('zoneImpression').classList.remove('rendu-pdf');
    if(bouton){ bouton.disabled = false; bouton.textContent = texte; }
  }
}
const nomFichier = base => base.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9_-]+/g,'-') + '.pdf';

function pageClient(){
  if(!etat.enseigne) return el('div',{class:'vide'}, "Choisissez d'abord votre enseigne dans l'onglet « Mon enseigne ».");
  const e = ENSEIGNES[etat.enseigne];
  const page = el('section',{},
    el('h2',{}, 'Client test — '+e.nom),
    el('p',{class:'aide'}, `Voici le magasin ${e.nom} tel que l'enseigne l'a aménagé. Un autre binôme joue les clients : orientez-les, comme vous le ferez en PFMP dans un magasin que vous n'avez pas conçu.`),
    el('div',{class:'ligne-btn', style:'margin-bottom:10px'}, el('button',{class:'btn', type:'button', onclick:imprimerJeuRole}, '📄 Télécharger le plan et les cartes en PDF (jeu de rôle sans ordinateur)')),
    el('div',{class:'atelier atelier-client', id:'atelierClient'}),
    el('div',{class:'verif', style:'margin-top:24px'},
      el('div',{class:'verif-tete'}, el('span',{class:'etiquette', style:'margin:0'}, 'Préparer l\u2019oral'),
        el('button',{class:'btn plein', id:'btnImprimer', type:'button', onclick:imprimerOral}, '📄 Télécharger la page de l\u2019oral en PDF')),
      el('p',{style:'margin:0'}, "Un PDF d'une page A4 en paysage : votre plan, la vue 3D, votre moodboard et les raisons de vos choix. Il sert pour l'oral et comme preuve dans votre portfolio.")));
  setTimeout(rendreClient);
  return page;
}

function pageBientot(o){
  return el('div',{class:'bientot'},
    el('h2',{}, o.nom),
    el('p',{}, `Cet onglet arrivera pour la ${o.seance.toLowerCase()}.`));
}

/* =========================================================
   RENDU GÉNÉRAL
   ========================================================= */
function rendre(){
  if(!etat.ouverts[ongletActif]) ongletActif = 'accueil';
  rendreEquipe(); rendreOnglets();
  const o = ONGLETS.find(x=>x.id===ongletActif);
  const main = document.getElementById('contenu');
  if(o.bientot){ main.replaceChildren(el('div',{class:'page'}, pageBientot(o))); return; }
  const contenu = {accueil:pageAccueil, enseigne:pageEnseigne, moodboard:pageMoodboard, plan:pagePlan, vitrine:pageVitrine, client:pageClient}[o.id]();
  main.replaceChildren(el('div',{class:'page'+(['plan','vitrine','client'].includes(o.id)?' large':'')}, blocMission(o.id), contenu));
  rendreApercu();
}

/* =========================================================
   FICHIER : ENREGISTRER / OUVRIR
   ========================================================= */
document.getElementById('btnEnregistrer').addEventListener('click', ()=>{
  const [a,b] = prenoms();
  const ens = etat.enseigne ? ENSEIGNES[etat.enseigne].nom : 'sans-enseigne';
  const nom = `magasin_${ens}_${a}_${b}`.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^A-Za-z0-9_-]+/g,'-') + '.json';
  const blob = new Blob([JSON.stringify(etat)], {type:'application/json'});
  const lien = el('a',{href:URL.createObjectURL(blob), download:nom});
  document.body.append(lien); lien.click(); lien.remove();
  setTimeout(()=>URL.revokeObjectURL(lien.href), 2000);
  statut(`Fichier « ${nom} » créé. Rangez-le dans votre espace personnel.`);
});
document.getElementById('btnOuvrir').addEventListener('click', ()=>document.getElementById('fichierOuvrir').click());
document.getElementById('fichierOuvrir').addEventListener('change', ev=>{
  const f = ev.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      const d = JSON.parse(r.result);
      if(!d || d.version !== 1 || !d.mood) throw new Error();
      const ouverts = {...etat.ouverts};
      etat = fusion(etatVide(), d);
      // les onglets ouverts par l'enseignante sur ce poste restent ouverts
      for(const k in ouverts) etat.ouverts[k] = etat.ouverts[k] || ouverts[k];
      sauver(); rendre();
      statut(`Fichier « ${f.name} » ouvert.`);
    }catch(e){
      statut("Ce fichier ne vient pas de L'espace qui parle. Choisissez le fichier .json enregistré en fin de séance.");
    }
  };
  r.readAsText(f); ev.target.value='';
});

/* =========================================================
   ESPACE ENSEIGNANT
   ========================================================= */
const dlg = document.getElementById('dlgEnseignant');
document.getElementById('btnEnseignant').addEventListener('click', ()=>{
  document.getElementById('dlgCode').classList.remove('cache');
  document.getElementById('dlgBascules').classList.add('cache');
  document.getElementById('codeSaisi').value=''; document.getElementById('codeErreur').textContent='';
  dlg.showModal();
});
dlg.querySelectorAll('[data-fermer]').forEach(b=>b.addEventListener('click', ()=>dlg.close()));
function validerCode(){
  if(document.getElementById('codeSaisi').value.trim() !== CODE_ENSEIGNANT){
    document.getElementById('codeErreur').textContent = 'Code incorrect.'; return;
  }
  document.getElementById('dlgCode').classList.add('cache');
  document.getElementById('dlgBascules').classList.remove('cache');
  document.getElementById('bascules').replaceChildren(...ONGLETS.map(o=>
    el('label',{}, el('span',{}, `${o.nom} (${o.seance})`),
      el('input',{type:'checkbox', checked:etat.ouverts[o.id], onchange:ev=>{ etat.ouverts[o.id]=ev.target.checked; sauver(); rendre(); }}))));
}
document.getElementById('btnValiderCode').addEventListener('click', validerCode);
document.getElementById('codeSaisi').addEventListener('keydown', ev=>{ if(ev.key==='Enter') validerCode(); });
document.getElementById('btnToutEffacer').addEventListener('click', async ()=>{
  if(!await demander("Effacer tout le travail enregistré sur ce poste ? Les fichiers déjà enregistrés par les élèves ne sont pas touchés.", "Effacer")) return;
  try{ localStorage.removeItem(CLE_STOCKAGE); }catch(e){}
  etat = etatVide(); ongletActif='accueil'; dlg.close(); rendre();
  statut('Travail effacé sur ce poste.');
});

rendre();
statut(etat.maj ? "Travail retrouvé sur cet ordinateur." : "");
</script>
</body>
</html>
